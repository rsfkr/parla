name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: for f in js/*.js; do node --check "$f"; done

      - name: Validate content, assets, and versions
        run: node scripts/validate-data.js
